<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
<title>Live Player</title>
<style>
  :root{
    --bg:#000; --text:#e8eef4; --muted:#8a97a4;
    --live:#ff4d4d; --accent:#4fd1c5;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; place-items:center; min-height:100vh;
  }
  .stage{
    position:relative; width:100%; max-width:100vw; aspect-ratio:16/9;
    max-height:100vh; background:#000;
  }
  .stage video{ width:100%; height:100%; display:block; background:#000; }

  .badges{ position:absolute; top:14px; left:14px; display:flex; gap:8px; z-index:2; }
  .badge{
    font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.12); color:var(--muted);
    padding:4px 9px; border-radius:99px; display:flex; align-items:center; gap:6px;
    backdrop-filter:blur(4px);
  }
  .badge.live{ color:var(--live); border-color:rgba(255,77,77,.4); }
  .badge.live .pip{ width:7px; height:7px; border-radius:50%; background:var(--live);
    animation:pulse 1.6s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,77,77,.5); }
    70%{ box-shadow:0 0 0 6px rgba(255,77,77,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,77,77,0); }
  }

  .overlay-msg{
    position:absolute; inset:0; display:grid; place-items:center; text-align:center;
    color:var(--muted); font-size:14px; padding:24px; pointer-events:none; z-index:1;
  }
  .overlay-msg .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="stage">
    <video id="video" controls playsinline autoplay></video>
    <div class="badges" id="badges"></div>
    <div class="overlay-msg" id="overlay"><span class="spinner"></span>Connecting…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
/* ============================================================
   CONFIG — update this for your stream.
   ============================================================ */
const CONFIG = {
  // Your .m3u8 stream URL. This is the only line you need to change.
  STREAM_URL: "https://ott-nettv-01.nettv.com.np/ffplay/wc-Himalaya2/playlist.m3u8?wmsAuthSign=c2VydmVyX3RpbWU9Ni8xNS8yMDI2IDEyOjE2OjI3IEFNJmhhc2hfdmFsdWU9dXlhMVVRL1IvS2F6eDdrLzJmYVRaZz09JnZhbGlkbWludXRlcz0xNDQwJmlkPTIwMA==",

  // Optional: start muted (browsers block autoplay-with-sound until the
  // user interacts, so muted=true makes autoplay reliable).
  START_MUTED: true,
};

/* Allow a quick override for testing via  player.html?url=...  */
const urlOverride = new URLSearchParams(location.search).get("url");
const STREAM_URL = urlOverride || CONFIG.STREAM_URL;
/* ============================================================ */

const $ = id => document.getElementById(id);
const video = $("video");
let hls = null;

video.muted = CONFIG.START_MUTED;

function setOverlay(html){
  const el = $("overlay");
  el.innerHTML = html || "";
  el.style.display = html ? "grid" : "none";
}
function setBadges(arr){
  $("badges").innerHTML = arr.map(b =>
    b === "LIVE"
      ? '<span class="badge live"><span class="pip"></span>Live</span>'
      : `<span class="badge">${b}</span>`
  ).join("");
}

function destroy(){
  if (hls){ hls.destroy(); hls = null; }
  video.removeAttribute("src"); video.load();
}

function play(src){
  if (!src){ setOverlay("No stream URL configured."); return; }
  destroy();
  setOverlay('<span class="spinner"></span>Connecting…');
  setBadges([]);

  // Safari / iOS play HLS natively.
  if (video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = src;
    video.addEventListener("loadedmetadata", () => {
      setOverlay(""); setBadges(["LIVE"]); video.play().catch(() => {});
    }, { once:true });
    video.addEventListener("error", () => setOverlay("Could not load this stream."), { once:true });
    return;
  }

  if (!(window.Hls && Hls.isSupported())){
    setOverlay("This browser cannot play HLS."); return;
  }

  hls = new Hls({ lowLatencyMode:true, liveSyncDuration:3, enableWorker:true });
  hls.loadSource(src);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
    setOverlay("");
    setBadges([ data.levels.length > 1 ? "ABR" : "SINGLE", "LIVE" ]);
    video.play().catch(() => {});
  });

  hls.on(Hls.Events.ERROR, (_e, data) => {
    if (!data.fatal) return;
    if (data.type === Hls.ErrorTypes.NETWORK_ERROR){
      setOverlay('<span class="spinner"></span>Network error — retrying…');
      hls.startLoad();
    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR){
      setOverlay('<span class="spinner"></span>Media error — recovering…');
      hls.recoverMediaError();
    } else {
      setOverlay("Stream offline or unreachable.");
      destroy();
    }
  });
}

play(STREAM_URL);
</script>
</body>
</html>

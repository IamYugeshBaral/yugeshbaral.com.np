<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow">
<title>Live Player</title>
<style>
  :root{
    --bg:#000; --panel:#0c0f12; --text:#e8eef4; --muted:#8a97a4;
    --live:#ff4d4d; --accent:#4fd1c5; --border:rgba(255,255,255,.08);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100vh;
  }

  .toolbar{
    width:100%; max-width:100vw; background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  }
  .toolbar label{ font-size:12px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  .toolbar select,
  .toolbar input[type="text"]{
    background:#11161b; color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:13px;
    appearance:none;
  }
  .toolbar select{ min-width:220px; cursor:pointer; }
  .toolbar input[type="text"]{ min-width:320px; flex:1 1 320px; font-family:ui-monospace,monospace; font-size:12px; }
  .toolbar select:focus,
  .toolbar input[type="text"]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .toolbar .grow{ flex:1; }
  .toolbar button{
    background:#11161b; color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer;
  }
  .toolbar button:hover{ border-color:var(--accent); color:var(--accent); }

  .stage{
    position:relative; width:100%; max-width:100vw; aspect-ratio:16/9;
    flex:1 1 auto; background:#000;
  }
  .stage video,
  .stage iframe{ width:100%; height:100%; display:block; background:#000; border:0; }

  .badges{ position:absolute; top:14px; left:14px; display:flex; gap:8px; z-index:2; }
  .badge{
    font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.12); color:var(--muted);
    padding:4px 9px; border-radius:99px; display:flex; align-items:center; gap:6px;
    backdrop-filter:blur(4px);
  }
  .badge.live{ color:var(--live); border-color:rgba(255,77,77,.4); }
  .badge.live .pip{ width:7px; height:7px; border-radius:50%; background:var(--live);
    animation:pulse 1.6s infinite; }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,77,77,.5); }
    70%{ box-shadow:0 0 0 6px rgba(255,77,77,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,77,77,0); }
  }

  .overlay-msg{
    position:absolute; inset:0; display:grid; place-items:center; text-align:center;
    color:var(--muted); font-size:14px; padding:24px; pointer-events:none; z-index:1;
  }
  .overlay-msg .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite; margin:0 auto 12px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="toolbar">
    <label for="src">Source</label>
    <select id="src">
      <option value="__primary__">Primary stream (default)</option>
      <option value="" disabled>— Loading fallback list… —</option>
    </select>
    <button id="reload" title="Refresh playlist">↻ Refresh list</button>
    <span class="grow"></span>
    <span id="status" style="font-size:12px;color:var(--muted);"></span>
  </div>

  <div class="stage" id="stage">
    <video id="video" controls playsinline autoplay></video>
    <div class="badges" id="badges"></div>
    <div class="overlay-msg" id="overlay"><span class="spinner"></span>Connecting…</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  STREAM_URL: "https://ott-nettv-01.nettv.com.np/ffplay/wc-Himalaya2/playlist.m3u8?nimblesessionid=732122&wmsAuthSign=c2VydmVyX3RpbWU9Ni8yMi8yMDI2IDM6NTM6MzIgUE0maGFzaF92YWx1ZT1VcGtyV3JXdVlSY0ZCUHhtenZWUzZnPT0mdmFsaWRtaW51dGVzPTE0NDAmaWQ9MjAw",
  FALLBACK_PLAYLIST_URL: "https://cr7world.pages.dev/playlist.json",
  // High-priority fallbacks tried BEFORE playlist.json entries.
  PRIORITY_FALLBACKS: [
    { key: "xyzstreams-wc8", url: "https://xyzstreams.shop/wc-8-embed", kind: "iframe" },
  ],
  // Fail fast so we move to the next source quickly.
  ATTEMPT_TIMEOUT_MS: 4000,
  START_MUTED: true,
};

const urlOverride = new URLSearchParams(location.search).get("url");
const PRIMARY_URL = urlOverride || CONFIG.STREAM_URL;
/* ============================================================ */

const $ = id => document.getElementById(id);
const stage = $("stage");
const srcSelect = $("src");
const statusEl = $("status");
let video = $("video");
let hls = null;
let candidates = [];   // [{key,url,kind}]
let currentKey = null;

video.muted = CONFIG.START_MUTED;

function setOverlay(html){
  const el = $("overlay");
  el.innerHTML = html || "";
  el.style.display = html ? "grid" : "none";
}
function setBadges(arr){
  $("badges").innerHTML = arr.map(b =>
    b === "LIVE"
      ? '<span class="badge live"><span class="pip"></span>Live</span>'
      : `<span class="badge">${b}</span>`
  ).join("");
}
function setStatus(t){ statusEl.textContent = t || ""; }

function destroyPlayer(){
  if (hls){ try{ hls.destroy(); }catch(_){} hls = null; }
  const existing = stage.querySelector("video, iframe");
  if (existing && existing.tagName === "IFRAME"){
    const v = document.createElement("video");
    v.id = "video"; v.controls = true; v.playsInline = true; v.autoplay = true;
    v.muted = CONFIG.START_MUTED;
    existing.replaceWith(v);
    video = v;
  } else if (video){
    try{ video.pause(); }catch(_){}
    video.removeAttribute("src");
    try{ video.load(); }catch(_){}
  }
}

function swapToIframe(src){
  destroyPlayer();
  const f = document.createElement("iframe");
  f.src = src;
  f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
  f.allowFullscreen = true;
  f.referrerPolicy = "no-referrer";
  const v = stage.querySelector("video");
  if (v) v.replaceWith(f); else stage.prepend(f);
}

function tryHls(src){
  return new Promise(resolve => {
    destroyPlayer();
    setBadges([]);
    let done = false;
    const finish = ok => { if (!done){ done = true; clearTimeout(timer); resolve(ok); } };
    const timer = setTimeout(() => finish(false), CONFIG.ATTEMPT_TIMEOUT_MS);

    if (video.canPlayType("application/vnd.apple.mpegurl")){
      video.src = src;
      video.addEventListener("loadedmetadata", () => {
        setBadges(["LIVE"]); video.play().catch(() => {}); finish(true);
      }, { once:true });
      video.addEventListener("error", () => finish(false), { once:true });
      return;
    }

    if (!(window.Hls && Hls.isSupported())){ finish(false); return; }

    hls = new Hls({ lowLatencyMode:true, liveSyncDuration:3, enableWorker:true });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
      setBadges([ data.levels.length > 1 ? "ABR" : "SINGLE", "LIVE" ]);
      video.play().catch(() => {});
      finish(true);
    });
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (data.fatal) finish(false);
    });
  });
}

function buildCandidates(json){
  const direct = [], iframes = [];
  for (const [key, val] of Object.entries(json || {})){
    if (!val || typeof val !== "object" || !val.url) continue;
    const url = String(val.url).trim();
    if (!url) continue;
    if (val.type === "iframe"){
      iframes.push({ key, url, kind:"iframe" });
    } else if (/\.m3u8(\?|$)/i.test(url) && !val.clearKeys){
      direct.push({ key, url, kind:"hls" });
    }
    // DRM-protected MPDs are skipped — this player can't decrypt them.
  }
  return [...direct, ...iframes];
}

function populateSelect(){
  const groupHls = candidates.filter(c => c.kind === "hls");
  const groupIfr = candidates.filter(c => c.kind === "iframe");
  const opt = (c) =>
    `<option value="${c.kind}:${c.key}">${c.key}${c.kind === "iframe" ? "  (embed)" : ""}</option>`;

  srcSelect.innerHTML = `
    <option value="__primary__">Primary stream (default)</option>
    ${groupHls.length ? `<optgroup label="Direct HLS">${groupHls.map(opt).join("")}</optgroup>` : ""}
    ${groupIfr.length ? `<optgroup label="Iframe embeds">${groupIfr.map(opt).join("")}</optgroup>` : ""}
  `;
}

async function loadPlaylist(){
  setStatus("Loading fallback list…");
  try {
    const res = await fetch(CONFIG.FALLBACK_PLAYLIST_URL, { cache:"no-store" });
    const json = await res.json();
    candidates = [...CONFIG.PRIORITY_FALLBACKS, ...buildCandidates(json)];
    populateSelect();
    setStatus(`${candidates.length} fallback source${candidates.length === 1 ? "" : "s"} available`);
  } catch(e){
    candidates = [...CONFIG.PRIORITY_FALLBACKS];
    populateSelect();
    setStatus("Fallback list unreachable — priority only");
  }
}

async function playPrimary(){
  currentKey = "__primary__";
  setOverlay('<span class="spinner"></span>Connecting to primary…');
  const ok = await tryHls(PRIMARY_URL);
  if (ok){ setOverlay(""); return true; }
  setOverlay("Primary stream offline.");
  return false;
}

async function playCandidate(c){
  currentKey = `${c.kind}:${c.key}`;
  setOverlay(`<span class="spinner"></span>Loading ${c.key}…`);
  if (c.kind === "hls"){
    const ok = await tryHls(c.url);
    if (ok){ setOverlay(""); setBadges([c.key.toUpperCase(), "LIVE"]); return true; }
    setOverlay(`Could not load ${c.key}.`);
    return false;
  } else {
    swapToIframe(c.url);
    setOverlay("");
    setBadges([c.key.toUpperCase(), "EMBED"]);
    return true;
  }
}

srcSelect.addEventListener("change", async () => {
  const val = srcSelect.value;
  if (val === "__primary__"){ await playPrimary(); return; }
  const [kind, key] = val.split(":");
  const c = candidates.find(x => x.kind === kind && x.key === key);
  if (c) await playCandidate(c);
});

$("reload").addEventListener("click", loadPlaylist);

async function autoFallback(){
  setOverlay('<span class="spinner"></span>Primary offline — trying fallbacks…');
  let waited = 0;
  while (!candidates.length && waited < 5000){
    await new Promise(r => setTimeout(r, 200)); waited += 200;
  }
  for (let i = 0; i < candidates.length; i++){
    const c = candidates[i];
    setOverlay(`<span class="spinner"></span>Trying ${i+1}/${candidates.length} — ${c.key}…`);
    const ok = await playCandidate(c);
    if (ok){ srcSelect.value = `${c.kind}:${c.key}`; return true; }
  }
  setOverlay("All sources failed. Pick another from the dropdown above.");
  return false;
}

(async function start(){
  loadPlaylist();
  const ok = await playPrimary();
  if (!ok) await autoFallback();
})();
</script>
</body>
</html>
